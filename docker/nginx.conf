server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://leaderboard:3001;
        proxy_set_header Host $host;
        client_max_body_size 2k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /editeur {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /editeur/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
