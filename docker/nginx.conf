server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /admin {
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
